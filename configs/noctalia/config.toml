# Date, clock and avatar on every monitor; a widget without an output shows
# on one monitor only. The avatar stays clear of the Caps Lock notice, which
# shows just above the login box. Noctalia's service runs from the user's
# home; sticker paths do not expand ~.
[lockscreen_widgets.widget."minimal-date@HDMI-A-1"]
type = "clock"
output = "HDMI-A-1"
cx = 960.0
cy = 240.0
box_width = 440.0
box_height = 38.0
placement_width = 1920.0
placement_height = 1080.0
rotation = 0.0

[lockscreen_widgets.widget."minimal-date@HDMI-A-1".settings]
clock_style = "digital"
format = "{:%A, %d %B}"
font_family = "Inter"
color = "#F5F5F7"
background = false
background_padding = 0.0
center_text = true
shadow = true

[lockscreen_widgets.widget."minimal-clock@HDMI-A-1"]
type = "clock"
output = "HDMI-A-1"
cx = 960.0
cy = 330.0
box_width = 460.0
box_height = 140.0
placement_width = 1920.0
placement_height = 1080.0
rotation = 0.0

[lockscreen_widgets.widget."minimal-clock@HDMI-A-1".settings]
clock_style = "digital"
format = "{:%H:%M}"
font_family = "Inter"
color = "#F5F5F7"
background = false
background_padding = 0.0
center_text = true
shadow = true

[lockscreen_widgets.widget."minimal-avatar@HDMI-A-1"]
type = "sticker"
output = "HDMI-A-1"
cx = 960.0
cy = 612.0
box_width = 72.0
box_height = 72.0
placement_width = 1920.0
placement_height = 1080.0
rotation = 0.0

[lockscreen_widgets.widget."minimal-avatar@HDMI-A-1".settings]
image_path = ".config/noctalia/assets/profile-picture-circle.svg"
opacity = 1.0
background = false
background_padding = 0.0

