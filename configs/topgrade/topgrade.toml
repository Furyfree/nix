# Nix owns the system and its packages. Topgrade only updates user tools.
[misc]
only = ["mise", "github_cli_extensions", "sheldon", "tldr"]
first = ["mise"]
no_self_update = true
pre_sudo = false
sudo_loop = false
assume_yes = false
cleanup = false
ask_retry = true
notify_end = "on_failure"
show_distribution_summary = false

[mise]
bump = false
