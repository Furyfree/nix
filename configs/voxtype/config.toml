# Local dictation, controlled through Voxtype's recording commands.
engine = "whisper"
state_file = "auto"

# Let compositor shortcuts control recording without raw input-device access.
[hotkey]
enabled = false

[audio]
device = "default"
max_duration_secs = 60
pause_media = true

# Multilingual model per machine; Models are downloaded separately.
# Desktop (RTX 3080): large-v3-turbo is the recommended model (1.6 GB, GPU
# recommended). Laptop (Radeon 890M) and VM keep the small model.
[whisper]
mode = "local"
model = "small"
language = ["en", "da"]
translate = false

# Use the Wayland tools available on PATH, with clipboard fallback.
[output]
mode = "type"
driver_order = ["wtype", "clipboard"]
auto_submit = false

# Show recording progress without putting dictated text in notifications.
[output.notification]
on_recording_start = true
on_recording_stop = true
on_transcription = false
