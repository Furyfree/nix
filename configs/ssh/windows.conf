# Windows, linked as ~\.ssh\config on vm and desktop. 1Password's agent is
# Windows OpenSSH's default pipe, which SSH_AUTH_SOCK keeps while it is unset.
# ssh takes the first value it reads, so this comes before personal.conf's
# Unix socket.
Host *
    IdentityAgent SSH_AUTH_SOCK

Include ~/Projects/nix/configs/ssh/personal.conf
