# Work machines. Work hosts stay in a private 1Password document; fetch it once
# as ~/.ssh/local.conf (INSTALLATION.md). The .pub files select which agent key
# to use and come from 1Password at first boot.
Include ~/.ssh/local.conf

Host github.com
    User git
    IdentityFile ~/.ssh/github.pub
    IdentitiesOnly yes

# Every other host uses the work key.
Host * !github.com
    IdentityFile ~/.ssh/work.pub
    IdentitiesOnly yes

Host *
    IdentityAgent ~/.1password/agent.sock
