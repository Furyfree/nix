shell = "zsh"

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"

[plugins.completion-init]
inline = 'source "$ZDOTDIR/conf.d/completion.zsh" || return'

[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"
hooks.pre = '''
if command -v fzf >/dev/null 2>&1; then
  zstyle ':completion:*' menu no
'''
hooks.post = 'fi'

[plugins.zoxide-init]
inline = 'source "$ZDOTDIR/conf.d/zoxide.zsh"'

# Comment out when enabling deja below.
[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"

# Deja: alternative to zsh-autosuggestions. To enable, uncomment this and
# "github:Giammarco-Ferranti/deja" in mise/config.toml, and comment out
# [plugins.zsh-autosuggestions] above.
# [plugins.deja]
# github = "Giammarco-Ferranti/deja"

# Highlighting must load after completion and other line-editor plugins.
[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
