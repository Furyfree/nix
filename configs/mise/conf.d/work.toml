# The work machines, Ubuntu and the work Mac; ubuntu/home.nix and
# darwin/work.nix link this file. Projects bring their own tools through
# pixi, which ubuntu/apps.sh installs on Ubuntu with pixi's own installer.
[tools]
# Runs the npm tools below.
node = "lts"
# Python scripts and Java outside the projects.
uv = "latest"
java = "corretto-25"
# Git's pager (configs/git/config).
delta = "latest"
# Agents; ai-workflow links their shared rules and skills.
"npm:@openai/codex" = "latest"
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = ["@anthropic-ai/claude-code"] }
# The document-analysis skill's reader.
"npm:@llamaindex/liteparse" = "latest"
