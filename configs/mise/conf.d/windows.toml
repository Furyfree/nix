# Windows, the desktop and the VM; windows/profiles/vm.psd1 links this file.
# Agents run here too; development runs in NixOS in WSL. winget keeps 7-Zip,
# since Mise's is the 32-bit 7za without RAR; FFmpeg, since Mise's is a conda
# environment with Python; and ImageMagick, whose own build is there.
[tools]
# Runs the npm tools below.
node = "lts"
# win-setup builds on Windows.
dotnet = "10"
# Git's pager (configs/git/config).
delta = "latest"
# Agents; ai-workflow links their shared rules and skills.
"npm:@openai/codex" = "latest"
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = ["@anthropic-ai/claude-code"] }
# The document-analysis skill's reader.
"npm:@llamaindex/liteparse" = "latest"
# nswitch sets apps' settings with it.
yq = "latest"
# The PowerShell profile's prompt, jumps, listings and tools.
starship = "latest"
zoxide = "latest"
fzf = "latest"
bat = "latest"
eza = "latest"
lazygit = "latest"
fastfetch = "latest"
tealdeer = "latest"
neovim = "latest"
# Neovim builds its tree-sitter parsers with it.
tree-sitter = "latest"
# For agents: GitHub, search and videos.
gh = "latest"
ripgrep = "latest"
fd = "latest"
yt-dlp = "latest"
# pdftotext and the other Poppler tools, from conda-forge: Poppler makes no
# Windows build.
poppler = "latest"
