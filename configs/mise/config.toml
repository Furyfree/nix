# Every machine. conf.d/ adds more by machine: runtimes.toml on Linux, the
# personal Mac and Windows, agents.toml on Linux, the work Mac and Windows,
# linux-tools.toml on Linux, windows-tools.toml on Windows.
[tools]
# Runs the npm tools below.
node = "lts"

# ACP adapters for Obsidian's Agent Client; OpenCode and Grok speak ACP natively.
"npm:@agentclientprotocol/claude-agent-acp" = "latest"
"npm:@agentclientprotocol/codex-acp" = "latest"

# Agentic helpers
"npm:@llamaindex/liteparse" = "latest"
# Drives Brave Origin through agent-brave, a POSIX script; none for Windows.
agent-browser = { version = "latest", os = ["linux", "macos"] }

# Language helpers
"npm:markdownlint-cli" = "latest"
ruff = "latest"
stylua = "latest"
ty = "latest"
lua-language-server = "latest"
"npm:bash-language-server" = "latest"

# Shell and configuration helpers
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
jactionlint = "latest"
delta = "latest"
# Deja autosuggestions; enable together with [plugins.deja] in sheldon/plugins.toml.
# "github:Giammarco-Ferranti/deja" = "latest"

[settings]
# Nix, Homebrew or winget installs and updates Mise; Mise installs the
# tools above.
system_deps = "warn"
# nix-ld runs the prebuilt release; Mise compiles on NixOS by default.
node.compile = false

# Activate an existing uv environment without creating one on directory entry.
python.uv_venv_auto = "source"
