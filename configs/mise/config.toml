# Every machine. conf.d/ adds more by machine: runtimes.toml on Linux and the
# personal Mac, agents.toml on Linux and the work Mac, linux-tools.toml on
# Linux.
[tools]
# Runs the npm tools below.
node = "lts"

# ACP adapters for Obsidian's Agent Client; OpenCode and Grok speak ACP natively.
"npm:@agentclientprotocol/claude-agent-acp" = "latest"
"npm:@agentclientprotocol/codex-acp" = "latest"

# Agentic helpers
"npm:@llamaindex/liteparse" = "latest"
# Upstream publishes bare binaries; no registry entry.
"github:lightpanda-io/browser" = { version = "latest", bin = "lightpanda" }

# Language helpers
"npm:markdownlint-cli" = "latest"
ruff = "latest"
stylua = "latest"
ty = "latest"
lua-language-server = "latest"
"npm:bash-language-server" = "latest"

# Shell and configuration helpers
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
actionlint = "latest"
delta = "latest"
# Deja autosuggestions; enable together with [plugins.deja] in sheldon/plugins.toml.
# "github:Giammarco-Ferranti/deja" = "latest"

[env]
# Lightpanda sends usage telemetry unless this is set.
LIGHTPANDA_DISABLE_TELEMETRY = "true"

[settings]
# Nix or Homebrew installs and updates Mise; Mise installs the tools above.
system_deps = "warn"
# nix-ld runs the prebuilt release; Mise compiles on NixOS by default.
node.compile = false

# Activate an existing uv environment without creating one on directory entry.
python.uv_venv_auto = "source"
