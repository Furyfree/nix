# Mise's settings for every machine. Each machine also reads one file of
# tools from conf.d/: nixos.toml, wsl.toml, work.toml, mac.toml or
# windows.toml.
[settings]
# Nix, Homebrew or winget installs and updates Mise; Mise installs the
# tools in conf.d/.
system_deps = "warn"
# nix-ld runs the prebuilt release; Mise compiles on NixOS by default.
node.compile = false

# Activate an existing uv environment without creating one on directory entry.
python.uv_venv_auto = "source"
