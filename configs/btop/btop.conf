# Use the terminal's ANSI palette and background, without forcing TTY graphics.
color_theme = "noctalia"
theme_background = false

vim_keys = true
shown_boxes = "cpu mem proc"
cpu_single_graph = true
proc_colors = false
proc_gradient = false
clock_format = ""

# Keep this curated file intact; menu changes last for the current session.
save_config_on_exit = false
